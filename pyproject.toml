[project]
name = "soundpins-api"
version = "0.1.0"
description = "API REST SoundPins : extraits audio géolocalisés"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115", "pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
